name: Feature request
description: Suggest a product or workflow improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The best feature requests describe the coloring workflow and the problem to solve.
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: What are you trying to create, print, save, or color online?
      placeholder: "Example: creating 20 easy dinosaur coloring pages for a classroom activity"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Current problem
      description: What is difficult, slow, unclear, or missing today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would a good solution let you do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - AI coloring page generator
        - Photo to coloring page
        - Name to coloring page
        - Online coloring editor
        - Free coloring page collections
        - PNG and PDF download
        - Credits and billing
        - Account and saved pages
        - Documentation
        - Other
    validations:
      required: true
